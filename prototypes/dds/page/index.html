<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DDS timing</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; line-height: 1.4; }
      body { margin: 0 auto; padding: 16px; max-width: 720px; }
      h1 { font-size: 1.4rem; margin: 0 0 8px; }
      h3 { margin: 20px 0 4px; }
      .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 12px 0; }
      button, select { font: inherit; min-height: 44px; padding: 0 16px; border-radius: 8px; }
      #device { font-size: 0.8rem; opacity: 0.7; word-break: break-word; }
      .error { color: #d32f2f; }
    </style>
  </head>
  <body>
    <h1>DDS timing</h1>
    <p>
      Times the two heaviest things a bot does, on this device: choosing a card (an opening lead,
      solved on 100 sample deals) and a hard bidding decision (200 full double-dummy tables). Keep
      the screen on while it runs.
    </p>
    <p id="device"></p>
    <div class="controls">
      <label>Copies of DDS <select id="workers"></select></label>
      <button id="runBoth">Run with 1, then with that many</button>
      <button id="run">Run once</button>
      <button id="clear">Clear</button>
    </div>
    <div id="log"></div>
    <script type="module" src="./bench.js"></script>
  </body>
</html>
